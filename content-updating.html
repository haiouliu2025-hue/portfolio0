<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Selected work by Hai'ou Liu.">
<title>Selected Work — Hai’ou Liu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root { --ink:#142c27; --paper:#f7f3ea; --moss:#50705c; --rose:#e5c0c3; --sun:#efd970; --line:rgba(20,44,39,.25); }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; color:var(--ink); background:var(--paper); font-family:"Space Grotesk",Arial,sans-serif; }
a { color:inherit; text-decoration:none; }
.shell { width:min(1240px, calc(100% - 48px)); margin:0 auto; }
.nav { height:82px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); font-size:14px; }
.brand { font-family:"Playfair Display",serif; font-size:22px; letter-spacing:-.04em; }
.nav-links { display:flex; gap:25px; font-family:"DM Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.nav-links a:hover { color:var(--moss); }
.eyebrow { display:flex; align-items:center; gap:9px; font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
.eyebrow::before { content:""; width:27px; height:1px; background:currentColor; }
.hero { min-height:650px; padding:76px 0 48px; display:grid; grid-template-columns:1.25fr .75fr; gap:46px; align-items:end; border-bottom:1px solid var(--line); }
h1,h2,h3,p { margin-top:0; }
h1 { max-width:760px; margin:22px 0 30px; font-family:"Playfair Display",serif; font-size:clamp(55px,7.3vw,104px); font-weight:500; letter-spacing:-.065em; line-height:.92; }
.hero h1 em { color:var(--moss); font-weight:500; }
.lede { max-width:590px; font-size:18px; line-height:1.52; }
.hero-note { align-self:start; margin-top:18px; padding:18px 0; border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); font-family:"DM Mono",monospace; font-size:12px; line-height:1.6; }
.hero-image { position:relative; min-height:390px; overflow:hidden; background:var(--rose); }
.hero-image img { display: block;width:100%; max-width: 1200px;height:100%; position:absolute; inset:0; object-fit:cover; object-position:center; mix-blend-mode:multiply; }
.hero-image img.portrait { object-position:center 31%; mix-blend-mode:normal; }
.hero-image::after { content:"Selected work / 2022"; position:absolute; right:16px; bottom:14px; z-index:1; padding:6px 9px; color:var(--paper); background:var(--ink); font:10px "DM Mono",monospace; text-transform:uppercase; }
.section { padding:96px 0; border-bottom:1px solid var(--line); }
.section-heading { display:grid; grid-template-columns:.65fr 1.35fr; gap:32px; margin-bottom:46px; }
.section-heading h2 { margin:0; font-family:"Playfair Display",serif; font-size:clamp(37px,5vw,60px); font-weight:500; letter-spacing:-.055em; line-height:1; }
.section-heading p { max-width:500px; margin:6px 0 0; line-height:1.55; }
.project-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.project { min-height:505px; display:flex; flex-direction:column; border:1px solid var(--ink); background:var(--paper); transition:transform .24s ease,box-shadow .24s ease; }
.project:hover { transform:translate(-5px,-5px); box-shadow:6px 6px 0 var(--ink); }
.project-image { height:295px; position:relative; overflow:hidden; background:var(--rose); }
.project-image img { height:100%; width:100%; object-fit:cover; object-position:center; }
.project-meta { padding:20px 21px 24px; display:flex; flex:1; flex-direction:column; }
.index { font:11px "DM Mono",monospace; color:var(--moss); }
.project h3 { margin:21px 0 10px; font-family:"Playfair Display",serif; font-size:30px; font-weight:500; letter-spacing:-.04em; line-height:1; }
.project p { margin:0 0 20px; font-size:14px; line-height:1.48; }
.project .arrow { margin-top:auto; font:11px "DM Mono",monospace; text-transform:uppercase; }
.additional-work { background:linear-gradient(90deg,transparent 0,transparent 66%,rgba(229,192,195,.26) 66%,rgba(229,192,195,.26) 100%); }
.work-list { border-top:1px solid var(--ink); }
.work-list-item { display:grid; grid-template-columns:72px minmax(210px,1fr) minmax(190px,.65fr); gap:18px; align-items:baseline; padding:19px 0; border-bottom:1px solid var(--line); }
.work-list-item span,.bestseller-list span { font:11px "DM Mono",monospace; color:var(--moss); }
.work-list-item strong { font-family:"Playfair Display",serif; font-size:clamp(23px,2.4vw,31px); font-weight:500; letter-spacing:-.04em; }
.work-list-item strong a { text-decoration:none; }
.work-list-item strong a:hover { color:var(--moss); text-decoration:underline; text-underline-offset:5px; }
.work-list-item em { color:var(--moss); font-size:13px; font-style:normal; }
.bestseller-work { display:grid; grid-template-columns:1fr 1fr; gap:36px; margin-top:54px; padding:30px; color:var(--paper); background:var(--ink); }
.bestseller-work .eyebrow { color:var(--sun); }
.bestseller-work h3 { margin:17px 0 0; font-family:"Playfair Display",serif; font-size:34px; font-weight:500; letter-spacing:-.05em; line-height:1; }
.bestseller-list { border-top:1px solid rgba(247,243,234,.45); }
.bestseller-list p { display:flex; gap:18px; margin:0; padding:16px 0; border-bottom:1px solid rgba(247,243,234,.45); font-size:15px; }
.bestseller-list a { text-decoration:underline; text-decoration-color:rgba(247,243,234,.55); text-underline-offset:4px; }
.text-link { display:inline-block; margin-top:26px; font:11px "DM Mono",monospace; text-transform:uppercase; text-decoration:underline; text-underline-offset:5px; }
.ai-art { height:100%; position:relative; overflow:hidden; background:var(--ink); }
.ai-art span { position:absolute; border:1px solid var(--paper); border-radius:50%; opacity:.9; }
.ai-art span:nth-child(1){ width:300px;height:300px;left:-75px;top:20px; }
.ai-art span:nth-child(2){ width:215px;height:215px;right:-45px;bottom:-48px; background:var(--sun); }
.ai-art span:nth-child(3){ width:94px;height:94px;left:47%;top:39%; background:var(--rose); }
.ai-art::after { content:"HITL\A visual system"; white-space:pre; position:absolute; left:24px; bottom:22px; color:var(--paper); font:15px/1.25 "DM Mono",monospace; }
.about-grid { display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:start; }
.about-copy { font-family:"Playfair Display",serif; font-size:clamp(30px,3.5vw,46px); letter-spacing:-.045em; line-height:1.08; }
.facts { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--ink); border:1px solid var(--ink); }
.fact { min-height:122px; padding:17px; background:var(--paper); }
.fact b { display:block; margin-bottom:31px; font:11px "DM Mono",monospace; color:var(--moss); text-transform:uppercase; }
.fact span { font-size:15px; }
.footer { padding:27px 0 35px; display:flex; justify-content:space-between; gap:20px; font:11px "DM Mono",monospace; text-transform:uppercase; }
.footer a { text-decoration:underline; text-underline-offset:4px; }

/* case studies */
.case-hero { padding:54px 0 0; border-bottom:1px solid var(--line); }
.back { font:11px "DM Mono",monospace; text-transform:uppercase; }
.case-title { margin:58px 0 38px; max-width:960px; font-family:"Playfair Display",serif; font-size:clamp(54px,7vw,96px); font-weight:500; letter-spacing:-.07em; line-height:.91; }
.case-info { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--ink); }
.case-info div { padding:18px 18px 20px 0; border-right:1px solid var(--line); }
.case-info div+div { padding-left:18px; }
.case-info b { display:block; margin-bottom:8px; font:10px "DM Mono",monospace; color:var(--moss); text-transform:uppercase; }
.case-info span { font-size:15px; line-height:1.35; }
.case-cover { margin:46px 0 0; height:min(61vw,690px); overflow:hidden; background:var(--rose); }
.case-cover img { width:100%; height:100%; object-fit:cover; object-position:center; }
.case-cover--full { height:auto; overflow:visible; background:transparent; }
.case-cover--full img { display:block; height:auto; object-fit:contain; }
.case-content { display:grid; grid-template-columns:.55fr 1.45fr; gap:64px; padding:84px 0; }
.rail { font:11px "DM Mono",monospace; color:var(--moss); text-transform:uppercase; }
.story > section { margin-bottom:72px; }
.story h2 { margin-bottom:20px; font-family:"Playfair Display",serif; font-size:42px; font-weight:500; letter-spacing:-.055em; line-height:1; }
.story p { max-width:720px; font-size:17px; line-height:1.58; }
.decision { padding:25px 0; border-top:1px solid var(--ink); display:grid; grid-template-columns:55px 1fr; gap:16px; }
.decision:last-child { border-bottom:1px solid var(--ink); }
.decision-number { font:13px "DM Mono",monospace; color:var(--moss); }
.decision h3 { margin:0 0 8px; font-size:20px; }
.decision p { margin:0; font-size:15px; }
.case-image { margin:32px 0; border:1px solid var(--ink); }
.case-image img { display:block; width:100%; }
.caption { margin-top:9px; font:10px "DM Mono",monospace; color:var(--moss); text-transform:uppercase; }
.result-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1px; margin:27px 0 31px; background:var(--ink); border:1px solid var(--ink); }
.result { min-height:144px; padding:20px; background:var(--paper); }
.result strong { display:block; margin-bottom:16px; font-family:"Playfair Display",serif; font-size:42px; font-weight:500; letter-spacing:-.06em; line-height:.8; }
.result span { font:11px "DM Mono",monospace; text-transform:uppercase; }
.quote { padding:24px; border-left:5px solid var(--sun); background:#ede5d6; font-family:"Playfair Display",serif; font-size:24px; line-height:1.15; letter-spacing:-.035em; }
.research-cover { height:min(61vw,690px); position:relative; margin:46px 0 0; overflow:hidden; background:var(--ink); }
.research-cover .ai-art { height:100%; }
.research-cover .ai-art span:nth-child(1) { width:680px; height:680px; left:4%; top:-210px; }
.research-cover .ai-art span:nth-child(2) { width:370px; height:370px; right:7%; bottom:-160px; }
.research-cover .ai-art span:nth-child(3) { width:155px; height:155px; left:48%; top:39%; }
.research-cover .ai-art::after { left:40px; bottom:34px; font-size:19px; }
.status { display:inline-block; padding:7px 10px; background:var(--sun); font:10px "DM Mono",monospace; text-transform:uppercase; }
.about-page { padding:74px 0 64px; border-bottom:1px solid var(--line); }
.about-page h1 { max-width:1000px; margin-bottom:30px; }
.about-intro { max-width:710px; font-size:19px; line-height:1.58; }
.about-portrait { height:470px; margin-top:48px; overflow:hidden; background:var(--rose); }
.about-portrait img { width:100%; height:100%; object-fit:cover; object-position:center 31%; }
.about-section { display:grid; grid-template-columns:.45fr 1.55fr; gap:56px; padding:84px 0; border-bottom:1px solid var(--line); }
.about-columns { display:grid; grid-template-columns:1.05fr .95fr; gap:55px; }
.about-columns > p { margin:0; font-family:"Playfair Display",serif; font-size:31px; letter-spacing:-.04em; line-height:1.1; }
.about-points { border-top:1px solid var(--ink); }
.about-points p { display:flex; gap:14px; margin:0; padding:15px 0; border-bottom:1px solid var(--line); line-height:1.4; }
.about-points span { font:11px "DM Mono",monospace; color:var(--moss); }
.timeline article { display:grid; grid-template-columns:150px 1fr; gap:26px; padding:22px 0; border-top:1px solid var(--ink); }
.timeline article:last-child { border-bottom:1px solid var(--ink); }
.timeline article > span { font:11px "DM Mono",monospace; color:var(--moss); }
.timeline h2 { margin-bottom:8px; font-family:"Playfair Display",serif; font-size:29px; font-weight:500; letter-spacing:-.04em; line-height:1; }
.timeline p { margin:0; line-height:1.5; }
.about-contact { display:flex; align-items:end; justify-content:space-between; gap:28px; padding:82px 0; }
.about-contact h2 { max-width:670px; margin:17px 0 0; font-family:"Playfair Display",serif; font-size:clamp(34px,4.5vw,55px); font-weight:500; letter-spacing:-.055em; line-height:.98; }
.contact-button { min-width:190px; padding:19px; color:var(--paper); background:var(--ink); font:13px/1.4 "DM Mono",monospace; }
.project-hero-placeholder { display:flex; align-items:flex-end; justify-content:space-between; min-height:390px; margin:46px 0 0; padding:30px; color:var(--paper); background:var(--ink); overflow:hidden; }
.project-hero-placeholder span { font-family:"Playfair Display",serif; font-size:clamp(120px,22vw,300px); font-weight:500; letter-spacing:-.1em; line-height:.65; color:var(--sun); }
.project-hero-placeholder p { max-width:190px; margin:0; font:11px/1.5 "DM Mono",monospace; text-align:right; text-transform:uppercase; }
.draft-note { max-width:720px; padding:22px; border-left:5px solid var(--sun); background:#ede5d6; font-size:16px; line-height:1.55; }
@media (max-width:800px) { .shell{width:min(100% - 32px,1240px)} .nav-links{gap:13px;font-size:10px} .hero,.section-heading,.about-grid,.case-content,.about-section,.about-columns{grid-template-columns:1fr} .hero{padding-top:48px;gap:30px;min-height:0}.hero-image{min-height:300px}.project-grid{grid-template-columns:1fr}.project{min-height:0}.project-image{height:270px}.section{padding:66px 0}.case-info{grid-template-columns:1fr}.case-info div,.case-info div+div{padding:15px 0;border-right:0;border-bottom:1px solid var(--line)}.case-content{gap:22px;padding:58px 0}.rail{display:none}.case-cover,.research-cover{height:300px}.result-grid{grid-template-columns:1fr}.footer,.about-contact{flex-direction:column;align-items:flex-start}.story h2{font-size:37px}.additional-work{background:none}.work-list-item{grid-template-columns:42px 1fr}.work-list-item em{grid-column:2}.bestseller-work{grid-template-columns:1fr;padding:24px}.about-page{padding:55px 0}.about-portrait{height:360px}.about-section{gap:23px;padding:60px 0}.timeline article{grid-template-columns:1fr;gap:8px}.about-contact{padding:62px 0}.project-hero-placeholder{min-height:300px;padding:22px}.project-hero-placeholder p{max-width:135px} }

</style>
</head>
